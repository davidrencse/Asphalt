[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asphalt"
version = "0.1.0"
description = "Packet capture, decode, and analysis toolkit built on Scapy."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "click>=8.0.0",
    "scapy>=2.5.0",
]
